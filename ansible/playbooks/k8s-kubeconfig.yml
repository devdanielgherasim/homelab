---
# Fetches the cluster-admin kubeconfig from the control-plane node to a private local path,
# so nobody copies it by hand. The next stage (tofu/environments/platform) and kubectl read
# it from there. The file is a credential: mode 0600, outside the repository.
#
# Example:
#   ansible-playbook -i inventories/production/ \
#     playbooks/k8s-kubeconfig.yml --private-key ~/.ssh/homelab_admin_ed25519
#   (optional: -e k8s_kubeconfig_dest=/path/to/kubeconfig)

- name: Fetch the kubeconfig to the operator's machine
  hosts: k8s_control_plane
  gather_facts: false
  vars:
    k8s_kubeconfig_dest: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/homelab.conf"
  tasks:
    - name: Make sure the local directory exists and is private
      ansible.builtin.file:
        path: "{{ k8s_kubeconfig_dest | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Fetch admin.conf
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ k8s_kubeconfig_dest }}"
        flat: true
      become: true

    - name: Keep the local copy readable by its owner only
      ansible.builtin.file:
        path: "{{ k8s_kubeconfig_dest }}"
        mode: "0600"
      delegate_to: localhost
      become: false
