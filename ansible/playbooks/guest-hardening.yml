---
# Hardens the 4 VMs created by tofu/environments/homelab/ — SSH defense
# in depth + unattended security upgrades (no automatic reboot by
# default). See ansible/roles/guest_hardening/ for scope and what's
# deliberately deferred (ufw, swap-disable, fail2ban).
#
# Example:
#   ansible-playbook -i inventories/production/ \
#     playbooks/guest-hardening.yml --private-key ~/.ssh/homelab_admin_ed25519

- name: Harden homelab guest VMs
  hosts: homelab_vms
  become: true
  gather_facts: true
  roles:
    - guest_hardening
