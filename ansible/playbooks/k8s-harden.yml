---
# Applies the control-plane and kubelet hardening to an EXISTING cluster (a new
# cluster gets the same settings from k8s-bootstrap.yml). Idempotent: it does
# nothing when the running control plane already matches kubeadm-config.yaml.
#
# What it changes on the control-plane node, and what that costs:
#   * writes /etc/kubernetes/{kubeadm-config,audit-policy,admission-config}.yaml
#     and generates the Secret-encryption key under /etc/kubernetes/enc (once);
#   * regenerates the kube-apiserver, kube-controller-manager and kube-scheduler
#     static pods, so the API is unavailable for a short time while they restart
#     (workloads keep running); the old manifests are copied to
#     /var/backups/kubeadm first;
#   * re-encrypts every Secret, then proves the encryption by reading one
#     straight from etcd;
#   * gives /var/lib/etcd to a dedicated `etcd` account.
# On every node it restricts the kubelet files to root.
#
# Before running it for real: take a fresh etcd snapshot and a vzdump of cp01
# (docs/runbooks/backup-and-restore.md), and do a --check --diff first.
#
# Example:
#   ansible-playbook -i inventories/production/ \
#     playbooks/k8s-harden.yml --private-key ~/.ssh/homelab_admin_ed25519 --check --diff
#
# Rollback: copy the manifests from /var/backups/kubeadm/manifests-<epoch>/ back
# into /etc/kubernetes/manifests/ (the kubelet restarts the pods), or restore
# cp01 from its vzdump archive.

- name: Reconcile the control plane with its configuration
  hosts: k8s_control_plane
  become: true
  gather_facts: true
  roles:
    - kubeadm_init

- name: Restrict kubelet files to root (CIS 4.1.x)
  hosts: k8s_nodes
  become: true
  gather_facts: false
  roles:
    - kubelet_hardening
