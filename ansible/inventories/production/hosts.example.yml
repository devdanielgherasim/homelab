# Copy this file to hosts.yml in the same directory and fill in real values.
# hosts.yml is gitignored — never commit it. See docs/security/public-repository.md.
#
# Only the Proxmox host is listed here. The lab VMs (vpn01, cp01 and every
# worker) come from tofu_inventory.py next to this file, which builds the groups
# homelab_vms, vpn_gateway, k8s_control_plane, k8s_workers and k8s_nodes from
# OpenTofu's `nodes` output, so a new worker needs no edit in Ansible.
#
# Point Ansible at the whole directory so both sources are read:
#   ansible-playbook -i inventories/production/ playbooks/<playbook>.yml ...
#
# The dynamic inventory only reads OpenTofu's state (run it from a machine that has
# the state and the `tofu` binary; TOFU_BIN overrides the executable). Group
# variables such as group_vars/vpn_gateway.yml apply to its groups as usual.
proxmox:
  hosts:
    pve01:
      ansible_host: YOUR_PROXMOX_MGMT_IP_HERE   # e.g. 10.10.10.10 — see docs/architecture/networking.md
      ansible_user: root                         # bootstrap only — see group_vars/proxmox.yml.example
