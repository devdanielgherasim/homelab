---
- name: Persist required kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter
  become: true

- name: Load overlay and br_netfilter modules now
  # Plain `modprobe` (ansible-core has no builtin module-loading module —
  # that's community.general, avoided here to stay dependency-free, same
  # as elsewhere in this repo). modprobe is itself idempotent at the
  # kernel level; changed_when: false because the tracked state change is
  # the modules-load.d file above, not this immediate load.
  ansible.builtin.command:
    cmd: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter
  become: true
  changed_when: false

- name: Set required sysctl parameters
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
  become: true
  notify: Apply sysctl
