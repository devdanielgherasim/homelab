---
# Applies the LoadBalancer address pool to the cluster from the control-plane node.
# Idempotent: the object is rendered to a file, and only re-applied when its content
# changed or the object is missing. Read-only checks run under --check.

- name: Require at least one address block
  ansible.builtin.assert:
    that:
      - cilium_lb_pool_blocks | length > 0
      - cilium_lb_pool_blocks | selectattr('start', 'defined') | list | length == cilium_lb_pool_blocks | length
      - cilium_lb_pool_blocks | selectattr('stop', 'defined') | list | length == cilium_lb_pool_blocks | length
    fail_msg: >-
      cilium_lb_pool_blocks is empty or malformed. Set a list of {start, stop} address
      ranges in inventories/production/group_vars/k8s_control_plane.yml (see the
      .example file); they must be free addresses on the nodes' subnet, outside the
      router's DHCP range.
    quiet: true

- name: Render the pool
  ansible.builtin.template:
    src: ip-pool.yaml.j2
    dest: /etc/kubernetes/cilium-lb-pool.yaml
    owner: root
    group: root
    mode: "0600"
  become: true
  register: cilium_lb_pool_rendered

- name: Check whether the pool exists in the cluster
  ansible.builtin.command:
    cmd: "kubectl --kubeconfig /etc/kubernetes/admin.conf get ciliumloadbalancerippools.cilium.io {{ cilium_lb_pool_name }} -o name"
  become: true
  changed_when: false
  failed_when: false
  check_mode: false # read-only
  register: cilium_lb_pool_existing

- name: Apply the pool
  # Server-side apply keeps the object owned by this field manager, so a later
  # edit made elsewhere shows up as a conflict instead of being overwritten silently.
  ansible.builtin.command:
    cmd: "kubectl --kubeconfig /etc/kubernetes/admin.conf apply --server-side --field-manager=ansible-cilium-lb-pool -f /etc/kubernetes/cilium-lb-pool.yaml"
  become: true
  changed_when: true
  when: cilium_lb_pool_rendered is changed or cilium_lb_pool_existing.rc != 0
