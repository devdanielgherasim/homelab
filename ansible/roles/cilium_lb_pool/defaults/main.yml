---
# Address blocks Cilium may hand out to LoadBalancer Services. They are real LAN
# addresses, so they are set in the gitignored
# inventories/production/group_vars/k8s_control_plane.yml (see the .example file),
# never here. Pick addresses on the same subnet as the nodes, OUTSIDE the router's
# DHCP range and not used by any device.
cilium_lb_pool_blocks: []

# Only Services with this label receive an address from the pool (and are announced
# by the CiliumL2AnnouncementPolicy in kubernetes/platform/networking/).
cilium_lb_pool_label_key: homelab.io/lb-pool
cilium_lb_pool_label_value: private
cilium_lb_pool_name: private
