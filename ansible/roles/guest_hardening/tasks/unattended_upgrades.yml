---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Enable periodic package list updates and unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  become: true

- name: "Set automatic reboot behavior explicitly (default: no silent reboot)"
  # Ubuntu's package default is already "false" (commented out) — this
  # task makes the choice explicit and declarative rather than relying on
  # an unmanaged package default, and gives a real toggle
  # (guest_hardening_unattended_reboot) if that's ever wanted later.
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^\s*//?\s*Unattended-Upgrade::Automatic-Reboot\s'
    line: 'Unattended-Upgrade::Automatic-Reboot "{{ guest_hardening_unattended_reboot | lower }}";'
  become: true
