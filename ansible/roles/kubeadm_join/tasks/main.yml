---
# Requires playbooks/k8s-bootstrap.yml's play order: kubeadm_init on
# {{ kubeadm_join_control_plane_host }} must have already run earlier in
# THIS playbook run, so its join command is available via hostvars.

- name: Check whether this node has already joined a cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubeadm_join_kubelet_conf
  become: true

- name: Fail with a clear message if the control plane's join command isn't available
  ansible.builtin.assert:
    that:
      - hostvars[kubeadm_join_control_plane_host]['kubeadm_init_join_command'] is defined
    fail_msg: >-
      No join command found in hostvars['{{ kubeadm_join_control_plane_host }}'].
      kubeadm_init must run against that host earlier in the same
      playbook run — see playbooks/k8s-bootstrap.yml's play order.
  when: not kubeadm_join_kubelet_conf.stat.exists

- name: Join this node to the cluster (only if not already joined)
  ansible.builtin.command:
    cmd: "{{ hostvars[kubeadm_join_control_plane_host]['kubeadm_init_join_command'] }}"
  become: true
  when: not kubeadm_join_kubelet_conf.stat.exists
  changed_when: true
