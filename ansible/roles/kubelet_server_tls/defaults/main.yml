---
# Where kubeadm keeps the kubelet's configuration on a node, and the kubeadm configuration
# on the control plane (roles/kubeadm_init renders it there).
kubelet_server_tls_kubelet_config: /var/lib/kubelet/config.yaml
kubelet_server_tls_kubeadm_config: /etc/kubernetes/kubeadm-config.yaml
kubelet_server_tls_admin_conf: /etc/kubernetes/admin.conf
