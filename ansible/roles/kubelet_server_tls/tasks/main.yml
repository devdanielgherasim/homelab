---
# Makes the kubelets request their serving certificate from the cluster CA
# (serverTLSBootstrap) instead of generating a self-signed one. A new cluster gets this from
# the KubeletConfiguration document in roles/kubeadm_init's kubeadm-config; this role brings
# a cluster that was built without it to the same state, and is a no-op when it is already there.
#
# Until the certificate request is approved (kubelet-csr-approver, installed by Argo CD) the
# kubelet keeps serving with its self-signed certificate, so restarting it does not cut
# anything off. Run it one node at a time (`serial: 1` in the playbooks): pods keep running
# while a kubelet restarts, but there is no reason to restart all of them together.

- name: Look for the kubelet configuration on this node
  ansible.builtin.stat:
    path: "{{ kubelet_server_tls_kubelet_config }}"
  become: true
  register: kubelet_server_tls_stat

- name: Give nodes that join later the same setting
  # `kubeadm join` reads the kubelet-config ConfigMap. It is patched directly, not re-uploaded
  # with `kubeadm init phase upload-config`: that command reads the kubeadm-config file on the
  # control plane, which is the OLD rendering on a cluster that has not been through
  # roles/kubeadm_init since the template gained the KubeletConfiguration document (found when
  # the rollout left the ConfigMap unchanged). Only when the ConfigMap lacks the setting.
  when: "'k8s_control_plane' in group_names"
  block:
    - name: Read the kubelet-config ConfigMap
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ kubelet_server_tls_admin_conf }} -n kube-system
          get configmap kubelet-config -o jsonpath={.data.kubelet}
      become: true
      changed_when: false
      check_mode: false # read-only
      register: kubelet_server_tls_configmap

    - name: Add the setting to the ConfigMap
      # The current content is kept and one line is added, so nothing else in the ConfigMap
      # changes. The newline is a variable because Jinja does not turn a backslash-n inside a
      # string literal into a line break (the first version of this task wrote the two characters
      # into the ConfigMap; found by rendering it against the real content before running it),
      # while a YAML double-quoted scalar does.
      vars:
        kubelet_server_tls_nl: "\n"
        kubelet_server_tls_patch: >-
          {{ {'data': {'kubelet': [kubelet_server_tls_configmap.stdout | trim, 'serverTLSBootstrap: true', ''] | join(kubelet_server_tls_nl)}} | to_json }}
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ kubelet_server_tls_admin_conf }}"
          - -n
          - kube-system
          - patch
          - configmap
          - kubelet-config
          - --type
          - merge
          - -p
          - "{{ kubelet_server_tls_patch }}"
      become: true
      changed_when: true
      when: "'serverTLSBootstrap: true' not in kubelet_server_tls_configmap.stdout"

- name: Ask the kubelet on this node for a certificate from the cluster CA
  ansible.builtin.lineinfile:
    path: "{{ kubelet_server_tls_kubelet_config }}"
    regexp: '^serverTLSBootstrap:'
    line: "serverTLSBootstrap: true"
    insertafter: '^rotateCertificates:'
  become: true
  when: kubelet_server_tls_stat.stat.exists
  notify: Restart kubelet
