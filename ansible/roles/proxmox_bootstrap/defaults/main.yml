---
# Defaults — override in inventories/production/group_vars/proxmox.yml
# (copied from proxmox.yml.example, gitignored, never real values here).
proxmox_bootstrap_expected_mgmt_interface: "vmbr0"
proxmox_bootstrap_expected_mgmt_cidr: "CHANGE_ME"
proxmox_bootstrap_firewall_allowed_mgmt_cidrs: []
proxmox_bootstrap_opentofu_pve_user: "opentofu@pve"
proxmox_bootstrap_opentofu_pve_tokenid: "tofu"
# Least privilege for OpenTofu (see tasks/rbac.yml): a custom role with only what
# a clone-and-configure workflow needs, granted on a resource pool that holds
# the lab's VMs and the template — not on the whole tree. The role deliberately
# leaves out backup, console, migration, snapshots and the guest agent's file
# and command privileges.
proxmox_bootstrap_opentofu_role: "HomelabTofu"
proxmox_bootstrap_opentofu_role_privs:
  - VM.Allocate
  - VM.Audit
  - VM.Clone
  - VM.Config.CDROM
  - VM.Config.CPU
  - VM.Config.Cloudinit
  - VM.Config.Disk
  - VM.Config.HWType
  - VM.Config.Memory
  - VM.Config.Network
  - VM.Config.Options
  - VM.GuestAgent.Audit
  - VM.PowerMgmt
  # Read-only: lets the provider see which pool a VM is in. Without it the pool
  # looks unset, and the provider then tries to (re)add every VM to the pool,
  # which needs the write privilege Pool.Allocate.
  - Pool.Audit
proxmox_bootstrap_pool: "homelab"
# VMs that belong to the pool: every lab VM in the inventory (the OpenTofu-generated
# inventory carries each VM's `vmid`) plus the template. A static inventory without
# VMIDs falls back to the original four.
proxmox_bootstrap_pool_template_vmid: 9000
proxmox_bootstrap_pool_vmids: >-
  {{ ((groups['homelab_vms'] | default([]) | map('extract', hostvars, 'vmid') | select('defined') | list)
      or [101, 102, 103, 104]) + [proxmox_bootstrap_pool_template_vmid] }}
# The old grant of PVEVMAdmin on `/`. Leave false until the narrower grants have
# been tested, then set true once to remove it.
proxmox_bootstrap_remove_root_acl: false
proxmox_bootstrap_datastore_id: "local-lvm"
proxmox_bootstrap_opentofu_datastore_role: "PVEDatastoreUser"
# Proxmox VE 9's SDN layer checks SDN.Use even for the default Linux
# bridge (vmbr0 lives in the built-in "localnetwork" zone) — confirmed
# via a real 403 during rollout, not assumed. PVESDNUser is the matching
# built-in role. Keep this zone name in sync with tofu/modules/proxmox-vm/'s
# bridge default if that ever changes from vmbr0/localnetwork.
proxmox_bootstrap_sdn_zone: "localnetwork"
proxmox_bootstrap_opentofu_sdn_role: "PVESDNUser"
# Where the CA of each Proxmox host (a public certificate) is saved on the machine running
# Ansible. Outside the repository. Standalone nodes each have their own CA, so each host has
# its own file: `pve-root-ca.pem` for the first host of the `proxmox` group (the name the
# single-host setup always used) and `<host>-root-ca.pem` for the others.
proxmox_bootstrap_ca_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/homelab"
proxmox_bootstrap_ca_local_path: >-
  {{ proxmox_bootstrap_ca_dir }}/{{ 'pve' if inventory_hostname == groups['proxmox'][0]
                                     else inventory_hostname }}-root-ca.pem
# All the CAs in one file, for tools that read a single bundle (SSL_CERT_FILE for OpenTofu).
proxmox_bootstrap_ca_bundle_path: "{{ proxmox_bootstrap_ca_dir }}/pve-root-ca-bundle.pem"
proxmox_bootstrap_admin_ssh_pubkey_path: "~/.ssh/homelab_admin_ed25519.pub"
# Explicit, not derived from the pubkey path via regex — a regex_replace
# on a Jinja expression inside a YAML block scalar is fragile (backslash
# escaping crosses YAML and Jinja layers) and broke in practice: it left
# the .pub file being used as the private key in ssh_lockdown, which
# reads as odd file permissions on the "private key" rather than a
# clearly wrong path. Two explicit vars, no derivation, no ambiguity.
proxmox_bootstrap_admin_ssh_privkey_path: "~/.ssh/homelab_admin_ed25519"
proxmox_bootstrap_node_name: "{{ ansible_facts['hostname'] }}"
