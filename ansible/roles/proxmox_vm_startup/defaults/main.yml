---
# Boot order of the lab VMs after the Proxmox host starts (the lab is powered on
# and off). Applied here rather than by OpenTofu because changing a VM's
# `startup` needs Sys.Modify on `/`, which OpenTofu's token deliberately does not
# have (see docs/adr/0011-proxmox-api-token-privileges.md).
#
# Value = Proxmox `startup` string: `order` starts lowest first, `up` is the
# number of seconds to wait after this VM before the next one starts.
#
# The order follows each VM's role, so a new worker is ordered without any edit
# here: the VPN gateway first (remote access is back early), then the control
# plane with time to come up, then every worker.
proxmox_vm_startup_by_role:
  vpn: "order=1"
  control-plane: "order=2,up=60"
  worker: "order=3"

# Fallback for a static inventory that carries no `vmid` and `node_role` per
# host: the original four VMs, explicitly.
proxmox_vm_startup_orders:
  101: "order=1"
  102: "order=2,up=60"
  103: "order=3"
  104: "order=3"
