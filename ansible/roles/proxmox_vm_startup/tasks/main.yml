---
# Idempotent: reads each VM's current `startup` setting and only changes it when
# it differs. Runs on the Proxmox host as root, on that host's own VMs only: with
# more than one standalone Proxmox node, each VM belongs to the host named in its
# `proxmox_host` variable (from the OpenTofu-generated inventory).

- name: Work out the order of each VM on this host from the inventory
  # Needs `vmid` and `node_role` on every lab VM, as the OpenTofu-generated
  # inventory provides. A VM without `proxmox_host` (state written before a second
  # node existed) is taken to be on this host. Otherwise the explicit fallback list is used.
  ansible.builtin.set_fact:
    proxmox_vm_startup_effective: >-
      {{ dict(proxmox_vm_startup_local | map(attribute='vmid') | list
              | zip(proxmox_vm_startup_local | map(attribute='node_role')
                    | map('extract', proxmox_vm_startup_by_role) | list)) }}
  vars:
    proxmox_vm_startup_all: "{{ groups['homelab_vms'] | default([]) | map('extract', hostvars) | list }}"
    proxmox_vm_startup_local: >-
      {{ (proxmox_vm_startup_all | selectattr('proxmox_host', 'undefined') | list)
         + (proxmox_vm_startup_all | selectattr('proxmox_host', 'defined')
            | selectattr('proxmox_host', 'equalto', inventory_hostname) | list) }}
  when:
    - groups['homelab_vms'] | default([]) | length > 0
    - hostvars[groups['homelab_vms'][0]].vmid is defined
    - hostvars[groups['homelab_vms'][0]].node_role is defined

- name: Otherwise use the explicit fallback list
  ansible.builtin.set_fact:
    proxmox_vm_startup_effective: "{{ proxmox_vm_startup_orders }}"
  when: proxmox_vm_startup_effective is not defined

- name: Read the current startup setting of each VM
  ansible.builtin.shell:
    cmd: "set -o pipefail; qm config {{ item.key }} | sed -n 's/^startup: //p'"
    executable: /bin/bash
  loop: "{{ proxmox_vm_startup_effective | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
  check_mode: false # read-only
  register: proxmox_vm_startup_current

- name: Set the startup order where it differs
  ansible.builtin.command:
    argv:
      - qm
      - set
      - "{{ item.item.key }}"
      - --startup
      - "{{ item.item.value }}"
  loop: "{{ proxmox_vm_startup_current.results }}"
  loop_control:
    label: "VM {{ item.item.key }}: '{{ item.stdout | trim }}' -> '{{ item.item.value }}'"
  changed_when: true
  when: (item.stdout | trim) != (item.item.value | string)
