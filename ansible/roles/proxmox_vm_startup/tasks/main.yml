---
# Idempotent: reads each VM's current `startup` setting and only changes it when
# it differs. Runs on the Proxmox host as root.

- name: Work out the order of each VM from the inventory
  # Needs `vmid` and `node_role` on every lab VM, as the OpenTofu-generated
  # inventory provides. Otherwise the explicit fallback list is used.
  ansible.builtin.set_fact:
    proxmox_vm_startup_effective: >-
      {{ dict(groups['homelab_vms']
              | map('extract', hostvars, 'vmid') | list
              | zip(groups['homelab_vms']
                    | map('extract', hostvars, 'node_role')
                    | map('extract', proxmox_vm_startup_by_role) | list)) }}
  when:
    - groups['homelab_vms'] | default([]) | length > 0
    - hostvars[groups['homelab_vms'][0]].vmid is defined
    - hostvars[groups['homelab_vms'][0]].node_role is defined

- name: Otherwise use the explicit fallback list
  ansible.builtin.set_fact:
    proxmox_vm_startup_effective: "{{ proxmox_vm_startup_orders }}"
  when: proxmox_vm_startup_effective is not defined

- name: Read the current startup setting of each VM
  ansible.builtin.shell:
    cmd: "set -o pipefail; qm config {{ item.key }} | sed -n 's/^startup: //p'"
    executable: /bin/bash
  loop: "{{ proxmox_vm_startup_effective | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
  check_mode: false # read-only
  register: proxmox_vm_startup_current

- name: Set the startup order where it differs
  ansible.builtin.command:
    argv:
      - qm
      - set
      - "{{ item.item.key }}"
      - --startup
      - "{{ item.item.value }}"
  loop: "{{ proxmox_vm_startup_current.results }}"
  loop_control:
    label: "VM {{ item.item.key }}: '{{ item.stdout | trim }}' -> '{{ item.item.value }}'"
  changed_when: true
  when: (item.stdout | trim) != (item.item.value | string)
