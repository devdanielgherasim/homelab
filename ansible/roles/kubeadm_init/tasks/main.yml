---
# Idempotency here is load-bearing, not optional: `kubeadm init` is not
# safely re-runnable, and `kubeadm reset` (the only real "undo") is
# explicitly in AGENTS.md's destructive-action policy — this role never
# runs it, under any condition.
#
# The role has two jobs that share one configuration file:
#   * new cluster:      `kubeadm init --config` builds a hardened control plane;
#   * running cluster:  reconcile.yml regenerates the static pods when the
#                       configuration changed, then proves encryption at rest.

- name: Render the control-plane configuration
  ansible.builtin.import_tasks: config.yml

- name: Check whether this control plane is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_init_admin_conf
  become: true

- name: Run kubeadm init from the configuration (only if not already initialized)
  ansible.builtin.command:
    cmd: "kubeadm init --config {{ kubeadm_init_config_dir }}/kubeadm-config.yaml"
  become: true
  when: not kubeadm_init_admin_conf.stat.exists
  changed_when: true
  # The output contains a join command with a token, so it is not printed.
  no_log: true

- name: Bring a running control plane in line with the configuration
  ansible.builtin.import_tasks: reconcile.yml
  when: kubeadm_init_admin_conf.stat.exists

- name: Check whether etcd's data directory exists
  ansible.builtin.stat:
    path: /var/lib/etcd
  register: kubeadm_init_etcd_dir
  become: true

- name: Create a dedicated etcd account
  # CIS 1.1.12: the data directory should belong to a dedicated user. The etcd
  # static pod still runs as root, which can read it either way.
  ansible.builtin.user:
    name: etcd
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  become: true

- name: Give the etcd data directory to that account
  ansible.builtin.file:
    path: /var/lib/etcd
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"
    recurse: true
  become: true
  when: kubeadm_init_etcd_dir.stat.exists

- name: Ensure ~/.kube exists for the ubuntu user
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
  become: true

- name: Copy admin kubeconfig for the ubuntu user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  become: true

# Always (re)create a join token, whether or not init just ran — token
# creation is safe/idempotent (short-lived credential, not cluster
# state), and kubeadm_join needs one available via hostvars regardless of
# whether this is a first run or a later re-run adding/fixing a worker. A short
# lifetime keeps unused tokens from accumulating as standing credentials.
- name: Create a fresh, short-lived join command
  ansible.builtin.command:
    cmd: kubeadm token create --ttl 30m --print-join-command
  become: true
  changed_when: true
  no_log: true
  register: kubeadm_init_join_command_result

- name: Expose the join command to other hosts in this playbook run
  ansible.builtin.set_fact:
    kubeadm_init_join_command: "{{ kubeadm_init_join_command_result.stdout | default('') }}"
  no_log: true

- name: Reminder — nodes stay NotReady until a CNI is installed
  ansible.builtin.debug:
    msg: >-
      Control plane ready. On a new cluster, nodes stay NotReady until Cilium
      is installed (kubernetes/bootstrap/cilium) — that is expected, not a
      failure of this role.
