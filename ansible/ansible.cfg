[defaults]
roles_path = ./roles
retry_files_enabled = false
host_key_checking = true
interpreter_python = auto_silent
# Point -i at the whole inventories/production/ directory: it holds the static file
# (the Proxmox host) and tofu_inventory.py (the lab VMs). The *.example files that
# sit next to them are templates, not inventory.
inventory_ignore_patterns = \.example\.ya?ml$
