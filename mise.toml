# Pinned local tool versions for this repository, managed by mise
# (https://mise.jdx.dev). Run `mise install` after cloning.
#
# VERSION-DEPENDENT ASSUMPTION: pins below reflect versions known-good as
# of repository bootstrap (2026-09-15). They are not re-verified against
# upstream on every session. Before bumping, use the `research-brief`
# skill / Perplexity to check for newer stable releases, breaking changes,
# or deprecations — see docs/contributing/ai-collaboration.md. `make
# doctor` reports drift between this file and what's installed; it does
# not auto-update this file.
#
# trivy=0.57.1 (the original bootstrap pin) does not exist — 404 on first
# real `mise install`. Corrected to 0.74.0 (verified via live search
# 2026-09-15, latest stable as of 2026-08-14). Also see the trivy-action
# supply-chain note in .github/workflows/security.yml — the CI action and
# this binary are different projects with independent version histories;
# 0.74.0 the binary is unaffected by that incident.
#
# yamllint, ansible-core, ansible-lint and pre-commit install via mise's
# pipx backend, which needs pipx (or uv) present first: `sudo apt install
# -y pipx` (Ubuntu/Debian) before `mise install` — see
# docs/contributing/development-workflow.md. ansible-core and ansible-lint
# are each pipx-isolated (separate venvs, each pulling its own ansible-core
# dependency) — a few extra MB on disk, no functional downside.
#
# 2026-09-15: all pins below re-verified live against current upstream
# releases (not just trivy). Two flagged for extra attention:
#   - helm 3.16.2 -> 4.3.0 is a MAJOR version jump (Helm v4 GA'd
#     2025-11-12; v3 gets security fixes only until 2027-02-10). No Helm
#     chart exists in this repo yet, so taking v4 now avoids starting on
#     a version already headed for EOL. Relevant if/when kubernetes/apps
#     gains charts: v3 Chart API v2 charts load unchanged; what breaks is
#     CI/automation (OCI env var removed, --wait now needs `watch` RBAC,
#     external --post-renderer executables must become plugins). See
#     docs/architecture/kubernetes.md when platform manifests land.
#   - age 1.2.1 -> 1.3.1: multiple inconsistent version signals surfaced
#     (some sources implied 1.3.2 exists) — 1.3.1 is the one confirmed
#     directly against FiloSottile/age's own releases page. Verify with
#     `age --version` after install; low-confidence pins like this are
#     exactly what `make doctor` drift-checking is for.

[tools]
gh = "2.100.0"
opentofu = "1.12.3"
kubectl = "1.37.0"
helm = "4.3.0"
age = "1.3.1"
sops = "3.13.3"
trivy = "0.74.0"
kubeconform = "0.8.0"
shellcheck = "0.11.0"
yamllint = "1.38.0"
gitleaks = "8.30.1"
"pipx:ansible-core" = "2.21.2"
"pipx:ansible-lint" = "26.8.0"
"pipx:pre-commit" = "4.6.2"

[settings]
experimental = true
