# Pinned local tool versions for this repository, managed by mise
# (https://mise.jdx.dev). Run `mise install` after cloning.
#
# VERSION-DEPENDENT ASSUMPTION: pins below reflect versions known-good as
# of repository bootstrap (2026-09-15). They are not re-verified against
# upstream on every session. Before bumping, use the `research-brief`
# skill / Perplexity to check for newer stable releases, breaking changes,
# or deprecations — see docs/contributing/ai-collaboration.md. `make
# doctor` reports drift between this file and what's installed; it does
# not auto-update this file.

