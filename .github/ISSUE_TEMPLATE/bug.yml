name: Bug report
description: Something in the repo (docs, CI, IaC, manifests) is wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What's wrong
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Do **not** include real credentials, tokens, or private network details in this report — this repository is public.
        See `docs/security/public-repository.md`.
