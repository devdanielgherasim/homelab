name: validate

# Bootstrap-safe CI: static validation only. Never connects to Proxmox,
# never deploys infrastructure or Kubernetes, never requires production
# credentials. Always runs on GitHub-hosted runners, including for PRs
# from forks — see docs/security/self-hosted-runners.md.
#
# Third-party actions are pinned to full commit SHAs (the trailing comment
# is the tag the SHA was resolved from). Dependabot
# (.github/dependabot.yml) proposes updates and keeps the comment in sync.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tofu: ${{ steps.filter.outputs.tofu }}
      ansible: ${{ steps.filter.outputs.ansible }}
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
      shell: ${{ steps.filter.outputs.shell }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            tofu:
              - 'tofu/**'
            ansible:
              - 'ansible/**'
              - 'scripts/test-*.sh'
            kubernetes:
              - 'kubernetes/**'
            shell:
              - '**/*.sh'
            docs:
              - '**/*.md'

  tofu:
    needs: changes
    if: needs.changes.outputs.tofu == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
      - name: tofu fmt -check
        # Single invocation so a formatting diff fails the job. (`find -exec`
        # always exits 0 regardless of the command's status.)
        run: tofu fmt -check -recursive -diff tofu
      - name: tofu validate (per module)
        run: |
          set -euo pipefail
          find tofu -name '*.tf' -exec dirname {} \; | sort -u | while read -r dir; do
            echo "== $dir =="
            (cd "$dir" && tofu init -backend=false -input=false && tofu validate)
          done

  ansible:
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-latest
    env:
      # ansible/ansible.cfg sets roles_path relative to itself; without this
      # the tools run from the repo root and cannot resolve any role.
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: pip install "ansible-core==2.21.*" "ansible-lint==26.8.*"
      - name: ansible-lint (production profile)
        run: ansible-lint
      - name: syntax-check
        run: |
          set -euo pipefail
          for playbook in ansible/playbooks/*.yml; do
            echo "== $playbook =="
            ansible-playbook --syntax-check "$playbook"
          done

  ansible-converge:
    # Applies roles inside a throwaway systemd container — never against real
    # hosts — and checks the resulting state and idempotence.
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Converge test (guest_hardening)
        run: scripts/test-guest-hardening.sh

  kubernetes:
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
        with:
          config_file: .yamllint.yaml
          file_or_dir: kubernetes
      - name: kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0 # keep in sync with mise.toml
        run: |
          set -euo pipefail
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -sSfL -O "${base}/kubeconform-linux-amd64.tar.gz" -O "${base}/CHECKSUMS"
          sha256sum --check --ignore-missing CHECKSUMS
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          # Helm values files are not Kubernetes resources (no `kind`), so they are skipped.
          find kubernetes -name '*.yaml' -print0 | xargs -0 -r ./kubeconform -strict -summary -ignore-filename-pattern '(^|/)values[^/]*[.]ya?ml$'

  shell:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          config: .markdownlint.jsonc
          globs: '**/*.md'
