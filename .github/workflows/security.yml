name: security

# Bootstrap-safe security scanning: secret detection + IaC config scan.
# GitHub-hosted runners only, no homelab credentials, no deployment.
# See docs/security/public-repository.md.
#
# trivy-action is pinned to v0.35.0, NOT @master and NOT any tag below it.
# On 2026-03-19, a compromised credential was used to force-push malware
# into 76 of 77 aquasecurity/trivy-action tags (v0.0.1-v0.34.2) and all 7
# aquasecurity/setup-trivy tags, exfiltrating CI secrets for ~12 hours
# (CVE-2026-33634 / GHSA-69fq-xp46-6x23). v0.35.0 was the one tag released
# after remediation and confirmed clean — this is not a routine pin choice,
# don't "helpfully" bump it to @master or @latest.
#
# gitleaks-action is pinned to v3, not v2: GitHub removes Node 20 from
# GitHub-hosted runners entirely on 2026-09-16 and gitleaks-action@v2
# (Node 20-based) stops working from that date regardless of any opt-out
# flag. v3 is a Node 24 runtime bump only — no input/output/behavior change.
#
# All actions are pinned to full commit SHAs (trailing comment = source tag).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC — catches drift/new CVEs, not just new commits

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history — a secret in an old commit still matters
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  topology-guard:
    # Real LAN addressing must never reach the public repository — see
    # docs/security/public-repository.md. gitleaks does not catch this (it
    # looks for secrets, and docs/*.md is allowlisted there), so check it
    # explicitly. The pattern is written with bracket expressions so this
    # file does not match itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reject real LAN addresses in tracked files
        run: |
          if git grep -nE '192[.]168[.][0-9]+[.][0-9]+' -- . ':!*.example'; then
            echo "::error::Real LAN addressing found in a tracked file. Use a placeholder or a gitignored file."
            exit 1
          fi

  trivy-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # scoped to this job only, for SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: '.'
          format: sarif
          output: trivy-results.sarif
          exit-code: '0' # report-only until findings are triaged; tighten later
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: trivy-results.sarif
