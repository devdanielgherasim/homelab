# Gateway API CRDs, standard channel, installed from the upstream repository at the
# pinned tag (config/crd is the standard channel; its resource list is identical to
# the release's standard-install.yaml, checked when this was written). Not vendored:
# it is 1.1 MB of generated YAML we would only ever bump wholesale. Bumping the
# version is one line, targetRevision, and the diff is visible in Argo CD.
#
# The bundle includes the safe-upgrades ValidatingAdmissionPolicy, which refuses to
# replace these CRDs with the experimental channel or a downgrade.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.2
    path: config/crd
  destination:
    server: https://kubernetes.default.svc
    # Everything here is cluster-scoped; the namespace is not used.
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # CRDs carry annotations larger than client-side apply allows.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
