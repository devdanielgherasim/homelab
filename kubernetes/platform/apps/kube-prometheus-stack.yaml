# Metrics and dashboards: Prometheus Operator, Prometheus, kube-state-metrics, node-exporter
# and Grafana, trimmed for a small cluster. Values and rationale: kubernetes/platform/observability/.
#
# The namespace and the Grafana admin Secret come from the platform stage
# (tofu/environments/platform), not from Git or by hand; see
# kubernetes/platform/observability/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    # Installs the monitoring.coreos.com CRDs, so it must be healthy before the
    # observability-dashboards Application (wave 11), which ships a PrometheusRule.
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.4.1
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/kubernetes/platform/observability/values.yaml
    - repoURL: https://github.com/devdanielgherasim/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The monitoring namespace, with its Pod Security labels, and the grafana-admin Secret
      # are created by the platform stage (tofu/environments/platform, ADR-0016), because the
      # Secret has to exist before this Application syncs. Argo CD does not create it.
      #
      # Required: the Prometheus and Alertmanager CRDs exceed the 256 KiB limit of the
      # last-applied-configuration annotation that client-side apply writes.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
