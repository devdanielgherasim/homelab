# Which nodes answer ARP for LoadBalancer addresses, and for which Services.
#
# Cilium's L2 announcements make one node claim each LoadBalancer IP on the LAN, so
# no extra component (MetalLB) is needed; see ADR-0015. The addresses themselves come
# from the CiliumLoadBalancerIPPool, which holds real LAN addresses and is therefore
# applied from a private inventory by ansible/roles/cilium_lb_pool, not from Git.
#
# Only Services carrying the label below are announced (the Gateway sets it through
# its infrastructure labels). The control-plane node is left out so the API server's
# node does not also carry ingress traffic.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: private
spec:
  serviceSelector:
    matchLabels:
      homelab.io/lb-pool: private
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  interfaces:
    - ^eth0$
  loadBalancerIPs: true
