# Kyverno (chart 3.9.1, Kyverno v1.19.1), trimmed for a small cluster and for validation only.
# Design and reasons: ADR-0019. Installed by kubernetes/platform/apps/kyverno.yaml.

# --- CRDs ---------------------------------------------------------------------------------
# The API server already holds 48 CRDs and about 1.2 GiB, so the CRD set is trimmed as far as
# Kyverno 1.19.1 allows. This cluster writes its policies as the new ValidatingPolicy (CEL) type
# and does not use the legacy ClusterPolicy and Policy types (the chart marks them deprecated),
# but both controllers REFUSE TO START without those two CRDs: the admission controller exits
# with "sanity checks failed ... CRD clusterpolicies.kyverno.io ... policies.kyverno.io ... not
# found" and the reports controller cannot list them. They were switched off first and the
# rollout showed it, so they are on, 1.4 MiB of schema each. The cleanup types go with the
# cleanup controller, which is off.
crds:
  install: true
  groups:
    kyverno:
      cleanuppolicies: false
      clustercleanuppolicies: false
      clusterpolicies: true
      globalcontextentries: true
      policies: true
      policyexceptions: true
      updaterequests: true
    # The `policies.kyverno.io` group (ValidatingPolicy and its siblings, 18 CRDs in all, 2.5 MiB)
    # has no switches that work: chart 3.9.1 lists `crds.groups.policies.*` in its values, but the
    # kyverno-api sub-chart that carries those CRDs is gated only by `crds.install`, so setting
    # them to false changes nothing (checked with `helm template`). It is installed whole.
    reports:
      clusterephemeralreports: true
      ephemeralreports: true
    wgpolicyk8s:
      clusterpolicyreports: true
      policyreports: true
  # The migration Job moves stored objects to a new CRD version; it is only needed when the
  # chart is upgraded, and Argo CD would run it on every sync. Turn it on for an upgrade and read
  # the release notes first.
  migration:
    enabled: false

# --- Components ---------------------------------------------------------------------------
# Admission controller: serves the webhooks the API server calls. One replica (one control
# plane, and the workers have little memory); the policies below fail open, so it being down does
# not stop the cluster.
admissionController:
  replicas: 1
  container:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 384Mi

# Background scans of existing resources and the policy reports.
reportsController:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

# Not used by validation-only policies: mutate-existing and generate (background controller),
# and scheduled deletion (cleanup controller).
backgroundController:
  enabled: false
cleanupController:
  enabled: false

# Removes Kyverno's webhook configurations when the release is deleted. The webhooks are created
# by the controller at run time, not by Helm, so without this an uninstall would leave webhooks
# that point at nothing.
webhooksCleanup:
  enabled: true
