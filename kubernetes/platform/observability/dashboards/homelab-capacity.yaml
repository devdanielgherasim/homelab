        {
          "id": 9,
          "type": "timeseries",
          "title": "Memory: requested vs allocatable per node",
          "description": "Dashed line is the ceiling (allocatable), solid is what pods have requested.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (node) (kube_node_status_allocatable{resource=\"memory\",node=~\"$node\"})",
              "legendFormat": "{{node}} allocatable",
              "refId": "A",
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (node) (kube_pod_container_resource_requests{resource=\"memory\",node=~\"$node\"} * on (namespace, pod) group_left () (kube_pod_status_phase{phase=~\"Pending|Running\"} == 1))",
              "legendFormat": "{{node}} requested",
              "refId": "B",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true,
                "lineInterpolation": "linear"
