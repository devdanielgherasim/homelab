# Capacity dashboard, provisioned by the Grafana sidecar (label grafana_dashboard). The
# grafana_folder annotation puts it in the "Homelab" folder. Every query uses kube-state-metrics
# series only (kube_node_status_allocatable, kube_pod_container_resource_requests,
# kube_pod_status_phase, kube_pod_status_unschedulable, kube_pod_info), so it works
# without scraping any control-plane component.
#
# The dashboard is a JSON document embedded in the ConfigMap; JSON strings (PromQL
# expressions, panel descriptions) cannot be wrapped, so line length is not enforced here.
# yamllint disable rule:line-length
apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-capacity-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: homelab-capacity-dashboard
    app.kubernetes.io/part-of: observability
  annotations:
    grafana_folder: Homelab
data:
  homelab-capacity.json: |
    {
      "uid": "homelab-capacity",
      "title": "Homelab / Capacity",
      "description": "Requested vs allocatable memory and CPU per node and cluster-wide, pending and unschedulable pods. Built from kube-state-metrics series only.",
      "tags": [
        "homelab",
        "capacity",
        "kube-state-metrics"
      ],
      "timezone": "browser",
      "editable": false,
      "graphTooltip": 1,
      "schemaVersion": 41,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "refresh": 1,
            "regex": "",
            "options": []
          },
          {
            "name": "node",
            "label": "Node",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(kube_node_status_allocatable, node)",
              "refId": "node"
            },
            "definition": "label_values(kube_node_status_allocatable, node)",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "includeAll": true,
            "multi": true,
            "refresh": 2,
            "sort": 1,
            "hide": 0,
            "regex": "",
            "options": [],
            "description": "Filters the per-node panels. The cluster-wide row always covers every node."
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Cluster (all nodes; control plane included)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Memory requested / allocatable",
          "description": "Sum of memory requests of Pending/Running pods placed on a node, over the sum of node allocatable memory. The alert fires above 80% for 10m.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_pod_container_resource_requests{resource=\"memory\",node!=\"\"} * on (namespace, pod) group_left () (kube_pod_status_phase{phase=~\"Pending|Running\"} == 1)) / sum(kube_node_status_allocatable{resource=\"memory\"})",
              "legendFormat": "",
              "refId": "A",
              "editorMode": "code",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 0,
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 0.85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
