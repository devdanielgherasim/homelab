# Helm values for the Cilium CNI, chart 1.20.2 (cilium/cilium from
# https://helm.cilium.io). See README.md in this directory for how to install
# it and what has been verified.
#
# Every key below was checked against `helm show values cilium/cilium
# --version 1.20.2`, not taken from documentation prose.

# Cilium replaces kube-proxy. Boolean, not the old "strict"/"probe" strings.
kubeProxyReplacement: true

# Without kube-proxy the in-cluster `kubernetes` Service does not work during
# bootstrap, so the agent must reach the API server directly. The host is the
# control-plane address of this lab, which is real network topology and is
# therefore passed by the platform stage from a private variable (k8s_service_host in
# tofu/environments/platform), never committed.
k8sServicePort: 6443

ipam:
  mode: cluster-pool
  operator:
    # Matches --pod-network-cidr in ansible/roles/kubeadm_init.
    clusterPoolIPv4PodCIDRList: ["10.244.0.0/16"]
    clusterPoolIPv4MaskSize: 24

operator:
  # One control-plane node: the default of 2 replicas has anti-affinity and
  # would leave the second pod Pending.
  replicas: 1
  rollOutPods: true
  prometheus:
    enabled: true
  dashboards:
    enabled: true
    namespace: monitoring
    annotations:
      grafana_folder: Cilium
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# LoadBalancer addresses on the LAN without MetalLB (ADR-0015): one node claims each
# address with ARP. Needs kubeProxyReplacement (set above). The address pool and the
# announcement policy live outside this file: the pool has real LAN addresses (created
# by the platform stage from a private variable) and the policy is in
# kubernetes/platform/networking/.
l2announcements:
  enabled: true

# Istio's sidecar (and ambient) traffic redirection conflicts with Cilium's
# socket-level load balancing inside pods. Keep socket LB to the host namespace, so
# service traffic from pods is balanced per packet instead, and do not let Cilium
# delete the chained istio-cni configuration.
socketLB:
  hostNamespaceOnly: true
cni:
  exclusive: false

# Envoy runs as one extra DaemonSet pod per node and is only needed for L7
# features (Ingress, Gateway API, L7 policy). North-south traffic goes through
# Istio (ADR-0006), and nodes have ~3 GB of RAM, so leave it off.
envoy:
  enabled: false

# Metrics. Only the endpoints and the Grafana dashboards are switched on here, not the
# ServiceMonitors: this chart is installed before Argo CD and before the Prometheus
# Operator's CRDs exist, so a ServiceMonitor here would fail on a cluster built from zero.
# The scrape configuration is in Git under kubernetes/platform/observability/monitors/
# (PodMonitors, applied by Argo CD once the CRDs are there). The dashboards must be in the
# `monitoring` namespace, which is the only one the Grafana sidecar reads (the platform
# stage creates it before this release).
prometheus:
  enabled: true
dashboards:
  enabled: true
  namespace: monitoring
  annotations:
    grafana_folder: Cilium

# Network policy audit mode: policies are evaluated and Hubble reports the verdict `AUDIT` for
# what they WOULD deny, but nothing is denied. On while the default-deny policies of
# kubernetes/platform/policies/ are introduced, so that a rule that was missed shows up in
# Hubble instead of cutting a service. Set to false (a Cilium restart) to enforce. See
# kubernetes/platform/policies/README.md for the order.
policyAuditMode: true

# Restart the agents by themselves when the ConfigMap changes: Helm does not, and the agents
# keep the old setting (seen with l2announcements, ADR-0015).
rollOutCiliumPods: true

hubble:
  enabled: true
  # Flow metrics add a lot of series; the list is short on purpose. Watch the Prometheus
  # memory limit (kubernetes/platform/observability/README.md) before adding more.
  metrics:
    enabled:
      - "dns:query;ignoreAAAA"
      - drop
      - tcp
      - flow
      - icmp
    dashboards:
      enabled: true
      namespace: monitoring
      annotations:
        grafana_folder: Cilium
  relay:
    enabled: true
    # TLS between Hubble clients (the UI, the CLI) and the relay. The Hubble
    # API exposes network flow metadata. Certificates are generated by Helm;
    # mutual TLS is left off so the UI can connect without a client
    # certificate, which is acceptable for an in-cluster, ClusterIP-only service.
    tls:
      server:
        enabled: true
        mtls: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
  ui:
    enabled: true
    frontend:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
    backend:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

# Agent: bounded memory so the observability stack that follows still fits.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
