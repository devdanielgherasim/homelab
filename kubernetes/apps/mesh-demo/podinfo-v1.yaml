apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo-v1
  labels:
    app: podinfo
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podinfo
      version: v1
  template:
    metadata:
      labels:
        app: podinfo
        version: v1
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.14.1
          # The image's CMD is ./podinfo; setting only args would replace it.
          command:
            - ./podinfo
            - --port=9898
            - --level=info
          env:
            - name: PODINFO_UI_MESSAGE
              value: podinfo v1 (6.14.1)
            - name: PODINFO_UI_COLOR
              value: "#3b82f6"
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo-v1
  labels:
    app: podinfo
    version: v1
spec:
  selector:
    app: podinfo
    version: v1
  ports:
    - name: http
      port: 9898
      targetPort: http
      appProtocol: http
